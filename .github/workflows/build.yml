name: Build WSPCLIENT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Extract source
        run: unzip -q WSPCLIENT-1.0-source.zip

      - name: Build mod
        working-directory: WSPCLIENT
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: WSPCLIENT-JAR
          path: WSPCLIENT/build/libs/*.jar
